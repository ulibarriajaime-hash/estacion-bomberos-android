name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El servidor ya trae el SDK de Android. Solo se aceptan las licencias
      # para que Gradle pueda descargar la plataforma que falte.
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: estacion-bomberos-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk estacion-bomberos.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest estacion-bomberos.apk \
            --title "APK de la estación de bomberos" \
            --notes "Instalador para Android 10 o más reciente. Descárgalo desde el teléfono y ábrelo."
