<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="shim.js"></script></head><body><title>Flujos de la estación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Diseño: lienzo a la izquierda con controles de reproducción encima, panel de edición a la derecha.
   Mismo lenguaje del programa: papel gris azulado, tinta oscura y rojo de emergencia como acento. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e6eaf1; --line:#ccd3de;
  --fg:#121a29; --muted:#566178; --accent:#c8281e; --accent-ink:#ffffff; --focus:#1f6fc2;
  --c1:#c8281e; --c2:#1f6fc2; --c3:#b25f00; --c4:#1c8a62; --c5:#7a4fc2;
  --c6:#0c8da6; --c7:#667286; --c8:#a88b00; --c9:#c4166b; --c10:#5c8a00;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131d; --surface:#161d2b; --surface-2:#1e2738; --line:#2c3749;
    --fg:#e6ebf4; --muted:#93a0b8; --accent:#ef5a4d; --accent-ink:#1a0a08; --focus:#6cb0f5;
    --c1:#ff6a5e; --c2:#6aa7ec; --c3:#e8a05a; --c4:#4cc29a; --c5:#b18df0;
    --c6:#4cc4dc; --c7:#98a5ba; --c8:#e6c84a; --c9:#ff6fb0; --c10:#9bd13c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#161d2b; --surface-2:#1e2738; --line:#2c3749;
  --fg:#e6ebf4; --muted:#93a0b8; --accent:#ef5a4d; --accent-ink:#1a0a08; --focus:#6cb0f5;
  --c1:#ff6a5e; --c2:#6aa7ec; --c3:#e8a05a; --c4:#4cc29a; --c5:#b18df0;
  --c6:#4cc4dc; --c7:#98a5ba; --c8:#e6c84a; --c9:#ff6fb0; --c10:#9bd13c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.eyebrow{margin:0 0 2px;font:600 13px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:700 40px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted)}
h2{margin:0 0 8px;font:700 19px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
h3{margin:0;font:600 14px/1.3 var(--font-body)}
h4{margin:10px 0 4px;font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:13px;max-width:70ch}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.side>section{border-top:2px solid var(--fg);padding-top:12px;min-width:0}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr)}}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:36px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:30px;padding:0 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.warn{color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:34px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
select,.in{min-height:36px;padding:5px 9px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.in.sm,select.sm{min-height:30px;padding:3px 7px;font-size:13px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label{font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>.field{flex:1 1 120px}
.sep{width:1px;height:24px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--surface-2);border-color:var(--fg);font-weight:600}
.chip[aria-pressed="false"]{opacity:.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.stage{position:relative;height:min(74vh,700px);min-height:460px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fs{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.fs.connect{cursor:crosshair}
.hud{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100% - 20px)}
.hud.top{top:10px;flex-direction:row;padding:6px 8px 6px 12px;background:var(--fg);color:var(--bg);border-radius:8px;gap:10px}
.hud.top .btn{min-height:28px;background:var(--bg);color:var(--fg);border-color:var(--bg)}
.hud.bottom{bottom:10px}
.tr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px color-mix(in srgb,var(--fg) 14%,transparent)}
.cap{max-width:min(560px,100%);padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.cap .n{font:700 13px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-right:8px}

/* Dibujo */
.halo{fill:color-mix(in srgb,var(--zc) 7%,var(--surface));stroke:var(--line);stroke-width:1}
.hz{font:700 15px var(--font-display);letter-spacing:.1em;text-transform:uppercase;fill:var(--zc)}
.node{cursor:grab}
.node rect{fill:var(--surface);stroke:var(--zc);stroke-width:1.3}
.node .ncode{font:500 10px var(--font-mono);fill:var(--zc)}
.node .nlab{font:500 11px var(--font-body);fill:var(--fg)}
.node.dim{opacity:.22}
.node.nb rect{stroke-width:2.2}
.node.sel rect{stroke:var(--fg);stroke-width:2.8}
.node.src rect{stroke:var(--accent);stroke-width:3}
.node.pick rect{fill:color-mix(in srgb,var(--accent) 24%,var(--surface));stroke:var(--accent);stroke-width:2.6}
.node.done rect{fill:color-mix(in srgb,var(--zc) 12%,var(--surface))}
.node.on rect{fill:color-mix(in srgb,var(--zc) 28%,var(--surface));stroke-width:2.8}
.eg{opacity:.55}
.eg .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.eg .ep{fill:none;stroke:var(--fc);stroke-width:1.6;pointer-events:none}
.eg .eh{fill:var(--fc);pointer-events:none}
.eg.hi{opacity:1}
.eg.hi .ep{stroke-width:2.6}
.eg.sel .ep{stroke-width:3.6}
.eg.dim{opacity:.07}
.eg.flow .ep{stroke-dasharray:9 6;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.eg.flow .ep{animation:none}}
.tmp{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:6 5;pointer-events:none}
.lg{font:500 12px var(--font-body);fill:var(--fg)}

/* Panel */
.rw{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--line)}
.rw .in{flex:1;min-width:0}
.rw .ct{font:500 12px var(--font-mono);color:var(--muted);min-width:24px;text-align:right}
.stp{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.stp.on{background:color-mix(in srgb,var(--accent) 9%,transparent);box-shadow:inset 3px 0 0 var(--accent);padding-left:8px}
.stp-h{display:flex;gap:6px;align-items:center}
.stp-h .go{font:700 13px var(--font-display);letter-spacing:.1em;text-transform:uppercase;min-width:58px;text-align:left;background:none;border:0;cursor:pointer;color:var(--accent);padding:0}
.stp-h .in{flex:1}
.stp-h .secs{flex:0 0 64px;text-align:right}
.mini{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mc{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--surface-2)}
.mc button{background:none;border:0;cursor:pointer;padding:0 4px;color:var(--muted)}
.mc button:hover{color:var(--accent)}
.warnl{font-size:12px;color:var(--accent)}
.ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.ul li{display:flex;align-items:center;gap:6px}
.ul li span{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);
  padding:10px 16px;background:var(--fg);color:var(--bg);border-radius:8px;z-index:50;text-align:center}
@media (max-width:560px){h1{font-size:32px}.stage{min-height:420px}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Estación de bomberos</p>
    <h1>Flujos de la estación</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="grid">
    <div class="main">
      <div class="bar">
        <button class="btn" id="mMove" aria-pressed="true">Mover</button>
        <button class="btn" id="mConn" aria-pressed="false">Conectar</button>
        <div class="field" style="min-width:150px"><label for="newFlow" class="sr">Tipo de la nueva conexión</label>
          <select id="newFlow" class="sm" aria-label="Tipo de la nueva conexión"></select></div>
        <span class="sep"></span>
        <button class="btn" id="addNode">+ Espacio</button>
        <button class="btn" id="autoLay">Ordenar por zona</button>
        <span class="sep"></span>
        <button class="btn" id="undo" aria-label="Deshacer">↶ Deshacer</button>
        <button class="btn" id="redo" aria-label="Rehacer">↷ Rehacer</button>
        <span class="sep"></span>
        <button class="btn" id="zOut" aria-label="Alejar">−</button>
        <button class="btn" id="zFit">Ajustar</button>
        <button class="btn" id="zIn" aria-label="Acercar">+</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Mostrar tipos de recorrido"></div>
      <div class="stage" id="stage">
        <svg class="fs" id="fsvg" tabindex="0" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de flujo entre los espacios de la estación"></svg>
        <div class="hud top" id="hudTop" hidden><span id="hudTxt"></span><button class="btn" id="hudDone">Listo</button></div>
        <div class="hud bottom">
          <div class="cap" id="cap" hidden></div>
          <div class="tr">
            <button class="btn" id="tPrev" aria-label="Paso anterior">‹</button>
            <button class="btn primary" id="tPlay">▶ Reproducir</button>
            <button class="btn" id="tNext" aria-label="Paso siguiente">›</button>
            <button class="btn" id="tStop" aria-label="Detener">■</button>
            <select id="tSpeed" class="sm" aria-label="Velocidad"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
            <label class="chk"><input type="checkbox" id="tLoop"> Repetir</label>
          </div>
        </div>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>

    <aside class="side">
      <section>
        <h2>Selección</h2>
        <div id="selBox"></div>
      </section>
      <section>
        <h2>Simulación</h2>
        <div id="simBox"></div>
      </section>
      <section>
        <h2>Tipos de recorrido</h2>
        <div id="flowBox"></div>
      </section>
      <section>
        <h2>Zonas</h2>
        <div id="zoneBox"></div>
      </section>
      <section>
        <h2>Archivo</h2>
        <div class="bar">
          <button class="btn primary" id="exSvg">Descargar SVG</button>
          <button class="btn" id="exPng">Descargar PNG</button>
          <button class="btn" id="exCsv">Conexiones CSV</button>
        </div>
        <div class="bar" style="margin-top:8px">
          <button class="btn" id="exJson">Guardar diagrama</button>
          <label class="btn" for="impFile" style="display:inline-flex;align-items:center">Cargar diagrama</label>
          <input class="sr" type="file" id="impFile" accept=".json,application/json">
          <button class="btn warn" id="resetAll">Restablecer todo</button>
        </div>
        <p class="hint" style="margin-top:8px">Tus cambios se guardan en este navegador. «Guardar diagrama» crea un archivo para llevarlo a otro equipo o compartirlo.</p>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/*PURE-START*/
var NW=196,NH=40;
var PALETTE=[{k:'c1',n:'Rojo'},{k:'c2',n:'Azul'},{k:'c3',n:'Naranja'},{k:'c4',n:'Verde'},{k:'c5',n:'Violeta'},{k:'c6',n:'Cian'},{k:'c7',n:'Gris'},{k:'c8',n:'Ámbar'},{k:'c9',n:'Rosa'},{k:'c10',n:'Lima'}];
var RAW={
  pub:['Acceso peatonal','Vestíbulo','Puesto de guardia','Área de atención','Acceso vehicular','Área de relación con la comunidad'],
  ope:['Cochera / piso de aparatos','Área para vehículos de emergencia','Área para ambulancia','Central de comunicaciones','Almacén de herramientas','Almacén de equipo de intervención','Almacén de equipo de rescate acuático','Taller','Área de descontaminación','Vestidor y equipo de protección'],
  hab:['Dormitorio general','Dormitorio de oficiales','Vestidores','Lockers','Sanitarios','Regaderas','Cocina','Comedor','Sala de descanso','Lavandería','Almacén de blancos','Patio de convivencia'],
  ent:['Torre de entrenamiento','Área de escalamiento','Balcones de práctica','Rescate vertical','Descenso con cuerdas','Acceso forzado','Simulación de humo','Rescate en espacios confinados','Apuntalamiento','Rescate vehicular','Estructuras colapsadas'],
  ser:['Cisterna','Cuarto de bombas','Área de llenado de pipas','Patio de lavado','Cuarto de máquinas','Cuarto eléctrico','Compresores / aire comprimido','Almacenamiento de residuos','Áreas técnicas']
};
var PREFIX={pub:'P',ope:'O',hab:'H',ent:'E',ser:'S'};
var PANEL={pub:{x:20,y:30},hab:{x:20,y:258},ope:{x:482,y:30},ent:{x:944,y:362},ser:{x:944,y:30}};
var EDGES_RAW={
  emer:'O4>H1 O4>H2 H1>O10 H2>O10 O10>O1 O1>O2 O1>O3 O2>P5 O3>P5 O4>O1',
  pub:'P1>P2 P2>P4 P2>P6 P3>P2 P5>P3',
  ret:'P5>O1 O1>O9 O9>O6 O9>H6 O9>H10 O9>S8 O1>S4',
  per:'H1>H3 H2>H3 H3>H4 H3>H5 H3>H6 H7>H8 H8>H9 H9>H12 H10>H11 H11>H1 H11>H2',
  ent:'O10>E1 E1>E2 E1>E3 E1>E4 E1>E5 E1>E6 E1>E7 O10>E8 O5>E9 O1>E10 E9>E11 E10>E11',
  ser:'S1>S2 S2>S3 S2>S4 S3>O2 S5>S9 S6>S5 S6>S2 S6>S7 S7>O6 H7>S8 O8>S8',
  log:'O5>O1 O6>O1 O7>O1 O8>O1 O8>O5'
};
function defaults(){
  var S={seq:1000,zones:[],nodes:[],flows:[],edges:[],scenarios:[],cur:'s1'};
  S.zones=[{id:'pub',name:'Zona pública',color:'c2'},{id:'ope',name:'Zona operativa',color:'c1'},{id:'hab',name:'Zona habitacional',color:'c4'},{id:'ent',name:'Zona de entrenamiento',color:'c3'},{id:'ser',name:'Zona de servicios',color:'c5'}];
  S.zones.forEach(function(z){RAW[z.id].forEach(function(n,i){
    S.nodes.push({id:PREFIX[z.id]+(i+1),code:PREFIX[z.id]+(i+1),name:n,zone:z.id,x:PANEL[z.id].x+16+(i%2)*(NW+14),y:PANEL[z.id].y+34+Math.floor(i/2)*52});
  });});
  S.flows=[{id:'emer',name:'Respuesta a emergencia',color:'c1',on:true},{id:'pub',name:'Público',color:'c2',on:true},{id:'ret',name:'Retorno y descontaminación',color:'c3',on:true},
    {id:'per',name:'Vida del personal',color:'c4',on:true},{id:'ent',name:'Entrenamiento',color:'c5',on:true},{id:'ser',name:'Servicios e instalaciones',color:'c6',on:true},{id:'log',name:'Equipo y logística',color:'c7',on:true}];
  var n=0;
  S.flows.forEach(function(f){EDGES_RAW[f.id].split(' ').forEach(function(p){var a=p.split('>');n++;S.edges.push({id:'e'+n,from:a[0],to:a[1],flow:f.id});});});
  function st(nodes,text){return {nodes:nodes,text:text,secs:1.5};}
  S.scenarios=[
    {id:'s1',name:'Salida de emergencia',steps:[
      st(['O4'],'La central de comunicaciones recibe la llamada y da la alarma.'),
      st(['H1','H2'],'El personal se levanta en los dormitorios.'),
      st(['O10'],'Se colocan el equipo de protección.'),
      st(['O1'],'Abordan las unidades en el piso de aparatos.'),
      st(['O2','O3'],'Salen los vehículos de emergencia y la ambulancia.'),
      st(['P5'],'Las unidades salen por el acceso vehicular.')]},
    {id:'s2',name:'Retorno y descontaminación',steps:[
      st(['P5'],'Las unidades regresan por el acceso vehicular.'),
      st(['O1'],'Ingresan al piso de aparatos.'),
      st(['O9'],'El personal y el equipo pasan por descontaminación.'),
      st(['O6','H10','H6','S8'],'El equipo limpio va al almacén, la ropa a lavandería, el personal a regaderas y los residuos a su almacenamiento.')]},
    {id:'s3',name:'Visita del público',steps:[
      st(['P1'],'Las personas llegan por el acceso peatonal.'),
      st(['P2'],'Pasan al vestíbulo.'),
      st(['P4','P6'],'Reciben atención o visitan el área de relación con la comunidad.')]}
  ];
  return S;
}
function wrapText(s,max){
  var words=String(s).split(' '),lines=[],cur='';
  words.forEach(function(w){var t=(cur?cur+' ':'')+w;if(t.length<=max||!cur)cur=t;else{lines.push(cur);cur=w;}});
  if(cur)lines.push(cur);
  if(lines.length>2)lines=[lines[0],lines.slice(1).join(' ')];
  if(lines[1]&&lines[1].length>max+4)lines[1]=lines[1].slice(0,max+1)+'…';
  return lines;
}
function geom(a,b){
  var ac=[a.x+NW/2,a.y+NH/2],bc=[b.x+NW/2,b.y+NH/2],dx=bc[0]-ac[0],dy=bc[1]-ac[1],p0,p1,c0,c1,k;
  if(Math.abs(dx)/(NW+20)>Math.abs(dy)/(NH+20)){
    var sx=dx>0?1:-1;
    p0=[ac[0]+sx*NW/2,ac[1]];p1=[bc[0]-sx*NW/2,bc[1]];
    k=Math.max(6,Math.abs(p1[0]-p0[0])*0.45);c0=[p0[0]+sx*k,p0[1]];c1=[p1[0]-sx*k,p1[1]];
  }else{
    var sy=dy>0?1:-1;
    p0=[ac[0],ac[1]+sy*NH/2];p1=[bc[0],bc[1]-sy*NH/2];
    k=Math.max(6,Math.abs(p1[1]-p0[1])*0.5);c0=[p0[0],p0[1]+sy*k];c1=[p1[0],p1[1]-sy*k];
  }
  var ang=Math.atan2(p1[1]-c1[1],p1[0]-c1[0]),L=9,sp=0.45;
  var h1=(p1[0]-L*Math.cos(ang-sp)).toFixed(1)+','+(p1[1]-L*Math.sin(ang-sp)).toFixed(1);
  var h2=(p1[0]-L*Math.cos(ang+sp)).toFixed(1)+','+(p1[1]-L*Math.sin(ang+sp)).toFixed(1);
  return {d:'M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+' C'+c0[0].toFixed(1)+','+c0[1].toFixed(1)+' '+c1[0].toFixed(1)+','+c1[1].toFixed(1)+' '+p1[0].toFixed(1)+','+p1[1].toFixed(1),pts:p1[0].toFixed(1)+','+p1[1].toFixed(1)+' '+h1+' '+h2};
}
function simCalcFor(S,sc,step){
  if(!sc||step<0)return null;
  var r={on:{},done:{},hi:{},flow:{}},st=sc.steps;
  for(var k=0;k<=step&&k<st.length;k++){
    st[k].nodes.forEach(function(id){if(k===step)r.on[id]=1;else r.done[id]=1;});
    if(k>0)S.edges.forEach(function(e){
      if(st[k-1].nodes.indexOf(e.from)>-1&&st[k].nodes.indexOf(e.to)>-1){r.hi[e.id]=1;if(k===step)r.flow[e.id]=1;}
    });
  }

}
function sanitize(d){
  if(!d||!Array.isArray(d.zones)||!Array.isArray(d.nodes)||!Array.isArray(d.flows)||!Array.isArray(d.edges)||!Array.isArray(d.scenarios))return null;
  var ck={};PALETTE.forEach(function(p){ck[p.k]=1;});
  var S={seq:+d.seq||1000,zones:[],nodes:[],flows:[],edges:[],scenarios:[],cur:d.cur};
  var zid={},nid={},fid={};
  d.zones.forEach(function(z){if(z&&z.id&&!zid[z.id]){zid[z.id]=1;S.zones.push({id:String(z.id),name:String(z.name||'Zona'),color:ck[z.color]?z.color:'c7'});}});
  if(!S.zones.length)return null;
  d.flows.forEach(function(f){if(f&&f.id&&!fid[f.id]){fid[f.id]=1;S.flows.push({id:String(f.id),name:String(f.name||'Recorrido'),color:ck[f.color]?f.color:'c7',on:f.on!==false});}});
  d.nodes.forEach(function(n){if(n&&n.id&&!nid[n.id]&&isFinite(+n.x)&&isFinite(+n.y)){nid[n.id]=1;S.nodes.push({id:String(n.id),code:String(n.code==null?'':n.code),name:String(n.name||'Espacio'),zone:zid[n.zone]?n.zone:S.zones[0].id,x:+n.x,y:+n.y});}});
  d.edges.forEach(function(e){if(e&&nid[e.from]&&nid[e.to]&&e.from!==e.to&&fid[e.flow])S.edges.push({id:String(e.id||('e'+(S.edges.length+1))),from:e.from,to:e.to,flow:e.flow});});
  d.scenarios.forEach(function(s){
    if(!s||!Array.isArray(s.steps))return;
    S.scenarios.push({id:String(s.id||('s'+(S.scenarios.length+1))),name:String(s.name||'Simulación'),steps:s.steps.map(function(t){
      return {nodes:(Array.isArray(t.nodes)?t.nodes:[]).filter(function(x){return nid[x];}),text:String(t.text||''),secs:isFinite(+t.secs)&&+t.secs>0?+t.secs:1.5};
    })});
  });
  if(!S.scenarios.length)S.scenarios.push({id:'s1',name:'Nueva simulación',steps:[{nodes:[],text:'Describe este paso.',secs:1.5}]});
  if(!S.scenarios.some(function(s){return s.id===S.cur;}))S.cur=S.scenarios[0].id;
  return S;
}

function measure(){CW=Math.max(300,stage.clientWidth);CH=Math.max(300,stage.clientHeight);svg.setAttribute('viewBox','0 0 '+CW+' '+CH);}
function bbox(){
  if(!S.nodes.length)return {x0:0,y0:0,x1:400,y1:300};
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.nodes.forEach(function(n){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+NW);y1=Math.max(y1,n.y+NH);});

}
function fitView(){
  var b=bbox(),bw=b.x1-b.x0,bh=b.y1-b.y0;
  view.k=Math.max(0.2,Math.min(1.3,(CW-24)/bw,(CH-24)/bh));
  view.tx=(CW-bw*view.k)/2-b.x0*view.k;view.ty=(CH-bh*view.k)/2-b.y0*view.k;
}
function zoomAt(f,px,py){
  var wx=(px-view.tx)/view.k,wy=(py-view.ty)/view.k;
  view.k=Math.max(0.15,Math.min(3,view.k*f));view.tx=px-wx*view.k;view.ty=py-wy*view.k;
}

/* ---------- Dibujo ---------- */
function simCalc(){return simCalcFor(S,curSc(),play.step);}
function content(o){
  o=o||{};
  var h='',sim=o.sim,clean=o.clean,i;
  S.zones.forEach(function(z){
    var ns=S.nodes.filter(function(n){return n.zone===z.id;});if(!ns.length)return;
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    ns.forEach(function(n){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+NW);y1=Math.max(y1,n.y+NH);});
    h+='<g style="--zc:var(--'+z.color+')"><rect class="halo" x="'+(x0-14)+'" y="'+(y0-32)+'" width="'+(x1-x0+28)+'" height="'+(y1-y0+46)+'" rx="8"/>'+
       '<text class="hz" x="'+(x0-14+14)+'" y="'+(y0-32+21)+'">'+esc(z.name)+'</text></g>';
  });
  var nb={};
  if(!clean&&!sim&&sel.t==='node'){S.edges.forEach(function(e){var f=flowById(e.flow);if(f&&f.on===false)return;if(e.from===sel.id||e.to===sel.id){nb[e.from]=1;nb[e.to]=1;}});}
  S.edges.forEach(function(e){
    var a=nodeById(e.from),b=nodeById(e.to),f=flowById(e.flow);if(!a||!b)return;
    var inSim=sim&&sim.hi[e.id];
    if(f&&f.on===false&&!inSim)return;
    var g=geom(a,b),cls='eg';
    if(clean)cls+=' hi';
    else if(sim){cls+=inSim?' hi':' dim';if(sim.flow[e.id])cls+=' flow';}
    else if(!clean){
      if(sel.t==='edge'&&sel.id===e.id)cls+=' sel hi';
      else if(sel.t==='node'){if(e.from===sel.id||e.to===sel.id)cls+=' hi';else cls+=' dim';}
    }
    h+='<g class="'+cls+'" style="--fc:var(--'+(f?f.color:'c7')+')">'+(clean?'':'<path class="hit" data-k="edge" data-id="'+e.id+'" d="'+g.d+'"/>')+
       '<path class="ep" d="'+g.d+'"/><polygon class="eh" points="'+g.pts+'"/></g>';
  });
  if(conn&&!clean){
    var a0=nodeById(conn.from);
    if(a0)h+='<path class="tmp" d="M'+(a0.x+NW/2)+','+(a0.y+NH/2)+' L'+conn.w[0].toFixed(1)+','+conn.w[1].toFixed(1)+'"/>';
  }
  S.nodes.forEach(function(n){
    var z=zoneById(n.zone),cls='node';
    if(sim){cls+=sim.on[n.id]?' on':(sim.done[n.id]?' done':' dim');}
    else if(!clean){
      if(pick!==null){var sc=curSc();if(sc&&sc.steps[pick]&&sc.steps[pick].nodes.indexOf(n.id)>-1)cls+=' pick';}
      if(sel.t==='node'){if(sel.id===n.id)cls+=' sel';else if(nb[n.id])cls+=' nb';else cls+=' dim';}
      if(conn&&conn.from===n.id)cls+=' src';
    }
    var lines=wrapText(n.name,24);
    h+='<g class="'+cls+'" data-k="node" data-id="'+n.id+'" style="--zc:var(--'+(z?z.color:'c7')+')" transform="translate('+n.x+','+n.y+')"><rect width="'+NW+'" height="'+NH+'" rx="5"/>'+
       '<text class="ncode" x="12" y="'+(NH/2+4)+'">'+esc(n.code||'')+'</text>';
    lines.forEach(function(l,li){h+='<text class="nlab" x="40" y="'+(lines.length===1?NH/2+4:16+li*13)+'">'+esc(l)+'</text>';});
    h+='<title>'+esc(n.name)+'</title></g>';
  });
  return h;
}

  if(a==='go'){goStep(i);return;}
  if(a==='pick'){pick=(pick===i)?null:i;stopAll(true);sel={t:null,id:null};buildSel();buildSim();render();hudUpdate();return;}
  if(a==='rmNode'){sc.steps[i].nodes=sc.steps[i].nodes.filter(function(x){return x!==b.dataset.n;});}
  else if(a==='up'&&i>0){var t=sc.steps[i];sc.steps[i]=sc.steps[i-1];sc.steps[i-1]=t;if(pick!==null)pick=null;}
  else if(a==='down'&&i<sc.steps.length-1){var t2=sc.steps[i];sc.steps[i]=sc.steps[i+1];sc.steps[i+1]=t2;if(pick!==null)pick=null;}
  else if(a==='dupStep'){sc.steps.splice(i+1,0,JSON.parse(JSON.stringify(sc.steps[i])));pick=null;}
  else if(a==='delStep'){sc.steps.splice(i,1);pick=null;if(!sc.steps.length)sc.steps.push(newStep());}
  else return;
  stopAll(true);buildSim();render();hudUpdate();commit();
});

/* Reproducción */
function updateTransport(){
  var sc=curSc(),n=sc?sc.steps.length:0;
  $('#tPlay').textContent=play.playing?'❚❚ Pausa':'▶ Reproducir';
  $('#tPrev').disabled=!n||play.step<=0;
  $('#tNext').disabled=!n||play.step>=n-1;
  $('#tStop').disabled=play.step<0;
}
function caption(){
  var sc=curSc(),c=$('#cap');
  if(!sc||play.step<0||!sc.steps[play.step]){c.hidden=true;return;}
  c.hidden=false;c.innerHTML='<span class="n">Paso '+(play.step+1)+' de '+sc.steps.length+'</span>'+esc(sc.steps[play.step].text);
}
function hilite(){Array.prototype.forEach.call(document.querySelectorAll('#simBox .stp'),function(el){el.classList.toggle('on',+el.dataset.i===play.step);});}
function hudUpdate(){
  var top=$('#hudTop');
  if(pick!==null){top.hidden=false;$('#hudTxt').textContent='Paso '+(pick+1)+': haz clic en los espacios que participan.';}
  else top.hidden=true;
  var hint={move:'Arrastra los espacios para reacomodarlos. Arrastra el fondo para mover el plano y usa la rueda para acercar.',connect:'Arrastra desde un espacio hasta otro para crear una conexión del tipo elegido.'}[mode];
  $('#modeHint').textContent=hint;
  svg.classList.toggle('connect',mode==='connect');
  $('#mMove').setAttribute('aria-pressed',String(mode==='move'));$('#mConn').setAttribute('aria-pressed',String(mode==='connect'));
  updateTransport();caption();hilite();
}
function stopTimer(){clearTimeout(play.timer);play.timer=null;}
function runStep(){
  var sc=curSc();if(!sc||!sc.steps[play.step]){stopAll(true);return;}
  render();caption();hilite();updateTransport();
  var st=sc.steps[play.step],ms=Math.max(250,(+st.secs||1.5)*1000/play.speed);
  stopTimer();
  play.timer=setTimeout(function(){
    if(play.step<sc.steps.length-1){play.step++;runStep();}
    else if(play.loop){play.step=0;runStep();}
    else{play.playing=false;play.timer=null;updateTransport();}
  },ms);
}
function pausePlay(){stopTimer();play.playing=false;updateTransport();}
function stopAll(silent){stopTimer();play.playing=false;play.step=-1;if(!silent){render();}caption();hilite();updateTransport();}
function goStep(i){
  var sc=curSc();if(!sc||!sc.steps.length)return;pausePlay();pick=null;sel={t:null,id:null};
  play.step=Math.max(0,Math.min(sc.steps.length-1,i));buildSel();render();caption();hilite();hudUpdate();
}
$('#tPlay').addEventListener('click',function(){
  var sc=curSc();if(!sc||!sc.steps.length){toast('Agrega pasos a la simulación.');return;}
  if(play.playing){pausePlay();return;}
  pick=null;sel={t:null,id:null};buildSel();
  if(play.step<0||play.step>=sc.steps.length-1)play.step=0;
  play.playing=true;hudUpdate();runStep();
});
$('#tNext').addEventListener('click',function(){goStep(play.step+1);});
$('#tPrev').addEventListener('click',function(){goStep(play.step-1);});
$('#tStop').addEventListener('click',function(){stopAll();});
$('#tSpeed').addEventListener('change',function(e){play.speed=+e.target.value||1;});
$('#tLoop').addEventListener('change',function(e){play.loop=e.target.checked;});
$('#hudDone').addEventListener('click',function(){pick=null;buildSim();render();hudUpdate();});

/* Tipos de recorrido y zonas */
function buildFlows(){
  var h='';
  S.flows.forEach(function(f){
    var n=S.edges.filter(function(e){return e.flow===f.id;}).length;
    h+='<div class="rw" data-id="'+f.id+'"><i class="dot" style="background:var(--'+f.color+')"></i>'+
      '<select class="sm" data-f="color" aria-label="Color de '+esc(f.name)+'" style="max-width:92px">'+colorOpts(f.color)+'</select>'+
      '<input class="in sm" data-f="name" value="'+esc(f.name)+'" aria-label="Nombre del tipo de recorrido">'+
      '<span class="ct" title="Conexiones">'+n+'</span><button class="btn sm warn" data-a="del" aria-label="Eliminar '+esc(f.name)+'">×</button></div>';
  });
  h+='<div class="bar" style="margin-top:8px"><button class="btn sm" id="addFlow">+ Agregar tipo</button></div>';
  $('#flowBox').innerHTML=h;
}
$('#flowBox').addEventListener('input',function(e){
  var row=e.target.closest('[data-id]');if(!row)return;var f=flowById(row.dataset.id);if(!f)return;
  if(e.target.dataset.f==='name'){f.name=e.target.value;buildChips();buildSim();}
});
$('#flowBox').addEventListener('change',function(e){
  var row=e.target.closest('[data-id]');if(!row)return;var f=flowById(row.dataset.id);if(!f)return;
  if(e.target.dataset.f==='color'){f.color=e.target.value;buildFlows();buildChips();render();}
  commit();
});
$('#flowBox').addEventListener('click',function(e){
  if(e.target.id==='addFlow'){var f={id:uid('f'),name:'Nuevo recorrido',color:PALETTE[S.flows.length%PALETTE.length].k,on:true};S.flows.push(f);buildFlows();buildChips();commit();return;}
  var b=e.target.closest('[data-a="del"]');if(!b)return;
  if(S.flows.length<2){toast('Debe quedar al menos un tipo de recorrido.');return;}
  var id=b.closest('[data-id]').dataset.id,n=S.edges.filter(function(x){return x.flow===id;}).length;
  S.flows=S.flows.filter(function(f){return f.id!==id;});S.edges=S.edges.filter(function(x){return x.flow!==id;});
  stopAll(true);if(sel.t==='edge'&&!edgeById(sel.id))sel={t:null,id:null};
  fullRefresh();commit();toast(n?'Se eliminaron el tipo y sus '+n+' conexiones. Puedes usar Deshacer.':'Tipo eliminado.');
});
function buildZones(){
  var h='';
  S.zones.forEach(function(z){
    var n=S.nodes.filter(function(x){return x.zone===z.id;}).length;
    h+='<div class="rw" data-id="'+z.id+'"><i class="dot" style="background:var(--'+z.color+')"></i>'+
      '<select class="sm" data-f="color" aria-label="Color de '+esc(z.name)+'" style="max-width:92px">'+colorOpts(z.color)+'</select>'+
      '<input class="in sm" data-f="name" value="'+esc(z.name)+'" aria-label="Nombre de la zona">'+
      '<span class="ct" title="Espacios">'+n+'</span><button class="btn sm warn" data-a="del" aria-label="Eliminar '+esc(z.name)+'">×</button></div>';
  });
  h+='<div class="bar" style="margin-top:8px"><button class="btn sm" id="addZone">+ Agregar zona</button></div>';
  $('#zoneBox').innerHTML=h;
}
$('#zoneBox').addEventListener('input',function(e){
  var row=e.target.closest('[data-id]');if(!row)return;var z=zoneById(row.dataset.id);if(!z)return;
  if(e.target.dataset.f==='name'){z.name=e.target.value;render();buildSel();}
});
$('#zoneBox').addEventListener('change',function(e){
  var row=e.target.closest('[data-id]');if(!row)return;var z=zoneById(row.dataset.id);if(!z)return;
  if(e.target.dataset.f==='color'){z.color=e.target.value;buildZones();render();}
  commit();
});
$('#zoneBox').addEventListener('click',function(e){
  if(e.target.id==='addZone'){var z={id:uid('z'),name:'Nueva zona',color:PALETTE[S.zones.length%PALETTE.length].k};S.zones.push(z);buildZones();buildSel();commit();return;}
  var b=e.target.closest('[data-a="del"]');if(!b)return;
  var id=b.closest('[data-id]').dataset.id;
  if(S.zones.length<2){toast('Debe quedar al menos una zona.');return;}
  if(S.nodes.some(function(n){return n.zone===id;})){toast('Cambia de zona o elimina sus espacios antes de borrarla.');return;}
  S.zones=S.zones.filter(function(z){return z.id!==id;});buildZones();buildSel();render();commit();
});

function fullRefresh(){buildChips();buildSel();buildSim();buildFlows();buildZones();render();hudUpdate();
  $('#sub').textContent=S.nodes.length+' espacios · '+S.edges.length+' conexiones · '+S.scenarios.length+' simulaciones';}

/* ---------- Interacción ---------- */
var drag=null;
svg.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var t=e.target.closest('[data-k]'),k=t?t.dataset.k:'bg',p=ptr(e),w=toW(p);
  drag={k:k,sx:p[0],sy:p[1],moved:false,tx0:view.tx,ty0:view.ty};
  if(k==='node'){
    var n=nodeById(t.dataset.id);drag.id=n.id;
    if(pick===null&&mode==='connect'){drag.conn=true;conn={from:n.id,w:w};}
    else if(pick===null){drag.o=[n.x,n.y];drag.w0=w;}
  }else if(k==='edge'){drag.id=t.dataset.id;}
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  svg.focus({preventScroll:true});
});
svg.addEventListener('pointermove',function(e){
  if(!drag)return;
  var p=ptr(e);
  if(!drag.moved&&Math.hypot(p[0]-drag.sx,p[1]-drag.sy)>4)drag.moved=true;
  if(!drag.moved)return;
  var w=toW(p);
  if(drag.k==='bg'||(drag.k==='edge')||(drag.k==='node'&&pick!==null)){view.tx=drag.tx0+(p[0]-drag.sx);view.ty=drag.ty0+(p[1]-drag.sy);render();return;}
  if(drag.k==='node'){
    if(drag.conn){conn.w=w;render();return;}
    var n=nodeById(drag.id);n.x=Math.round(drag.o[0]+w[0]-drag.w0[0]);n.y=Math.round(drag.o[1]+w[1]-drag.w0[1]);render();
  }
});
function endDrag(e){
  if(!drag)return;var d=drag;drag=null;
  if(d.k==='node'){
    if(pick!==null){
      if(!d.moved){var sc=curSc(),st=sc&&sc.steps[pick];
        if(st){var ix=st.nodes.indexOf(d.id);if(ix>-1)st.nodes.splice(ix,1);else st.nodes.push(d.id);buildSim();render();commit();}}
      else render();
      return;
    }
    if(d.conn){
      conn=null;
      if(d.moved&&e){
        var el=document.elementFromPoint(e.clientX,e.clientY),tg=el&&el.closest?el.closest('[data-k="node"]'):null;
        if(tg&&tg.dataset.id!==d.id){
          var fl=$('#newFlow').value,dup=S.edges.some(function(x){return x.from===d.id&&x.to===tg.dataset.id&&x.flow===fl;});
          if(dup){toast('Esa conexión ya existe.');}
          else{var ne={id:uid('e'),from:d.id,to:tg.dataset.id,flow:fl};S.edges.push(ne);sel={t:'edge',id:ne.id};stopAll(true);fullRefresh();commit();toast('Conexión creada.');return;}
        }
      }
      if(!d.moved){sel={t:'node',id:d.id};stopAll(true);buildSel();}
      render();return;
    }
    if(!d.moved){stopAll(true);sel={t:'node',id:d.id};buildSel();render();return;}
    commit();return;
  }
  if(d.k==='edge'&&!d.moved){stopAll(true);sel={t:'edge',id:d.id};buildSel();render();return;}
  if(d.k==='bg'&&!d.moved){
    if(play.step>=0){stopAll();return;}
    if(sel.t){sel={t:null,id:null};buildSel();render();}
  }
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',function(){drag=null;conn=null;render();});
svg.addEventListener('wheel',function(e){e.preventDefault();var p=ptr(e);zoomAt(Math.exp(-e.deltaY*0.0016),p[0],p[1]);render();},{passive:false});
svg.addEventListener('keydown',function(e){
  if((e.key==='Delete'||e.key==='Backspace')&&sel.t){e.preventDefault();if(sel.t==='node')delNode(sel.id);else delEdge(sel.id);}
  else if(e.key==='Escape'){pick=null;mode='move';conn=null;buildSim();render();hudUpdate();}
});
document.addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click();}
  else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();$('#redo').click();}
});
$('#mMove').addEventListener('click',function(){mode='move';hudUpdate();});
$('#mConn').addEventListener('click',function(){mode='connect';pick=null;buildSim();render();hudUpdate();});
$('#zIn').addEventListener('click',function(){zoomAt(1.25,CW/2,CH/2);render();});
$('#zOut').addEventListener('click',function(){zoomAt(0.8,CW/2,CH/2);render();});
$('#zFit').addEventListener('click',function(){fitView();render();});
$('#chips').addEventListener('click',function(e){
  var b=e.target.closest('[data-f]');if(!b)return;var f=flowById(b.dataset.f);if(!f)return;
  f.on=(f.on===false);buildChips();render();commit();
});
function nextCode(zid){
  var z=zoneById(zid),letter=((z&&z.name||'N').replace(/^zona\s+(de\s+)?/i,'').charAt(0)||'N').toUpperCase(),i=1,used={};
  S.nodes.forEach(function(n){used[n.code]=1;});
  while(used[letter+i])i++;return letter+i;
}
$('#addNode').addEventListener('click',function(){
  var zid=sel.t==='node'&&nodeById(sel.id)?nodeById(sel.id).zone:S.zones[0].id;
  var cx=(CW/2-view.tx)/view.k-NW/2,cy=(CH/2-view.ty)/view.k-NH/2;
  var n={id:uid('n'),code:nextCode(zid),name:'Nuevo espacio',zone:zid,x:Math.round(cx),y:Math.round(cy)};
  S.nodes.push(n);sel={t:'node',id:n.id};stopAll(true);mode='move';fullRefresh();commit();
  var el=$('#nName');if(el){el.focus();el.select();}
  toast('Espacio agregado al centro de la vista. Arrástralo a su lugar.');
});
$('#autoLay').addEventListener('click',function(){
  var colH=[30,30,30],PW=2*NW+14+32;
  S.zones.forEach(function(z){
    var ns=S.nodes.filter(function(n){return n.zone===z.id;});if(!ns.length)return;
    var c=colH.indexOf(Math.min.apply(null,colH)),x=20+c*(PW+24),y=colH[c];
    ns.forEach(function(n,i){n.x=x+16+(i%2)*(NW+14);n.y=y+34+Math.floor(i/2)*52;});
    colH[c]+=34+Math.ceil(ns.length/2)*52+8+34;
  });
  fitView();render();commit();toast('Espacios ordenados por zona.');
});

/* ---------- Exportar y archivo ---------- */
function saveFile(name,data){
  var uf=window.claude&&window.claude.use;
  if(!uf){
    var blob=data instanceof Blob?data:new Blob([data]);
    var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);toast('Se generó '+name+'.');return;
  }
  uf.call(window.claude,'downloads').then(function(dl){
    if(!dl){toast('La descarga no está disponible aquí.');return;}
    return dl.save({filename:name,data:data}).then(function(){toast('Archivo guardado.');},function(err){
      if(err&&err.code==='declined')return;toast('No se pudo guardar el archivo.');
    });
  },function(){toast('La descarga no está disponible aquí.');});
}
function exportSvgString(){
  var b=bbox(),bw=b.x1-b.x0,bh=b.y1-b.y0,visF=S.flows.filter(function(f){return f.on!==false;});
  var cols=Math.max(1,Math.floor(bw/250)),legH=Math.ceil(visF.length/cols)*22+16,Wx=Math.round(bw),Hx=Math.round(bh+legH);
  var tmp=document.createElementNS(NS,'svg');
  tmp.setAttribute('xmlns',NS);tmp.setAttribute('width',Wx);tmp.setAttribute('height',Hx);tmp.setAttribute('viewBox','0 0 '+Wx+' '+Hx);
  tmp.style.cssText='position:fixed;left:-99999px;top:0';
  var lg='';
  visF.forEach(function(f,i){
    var x=10+(i%cols)*250,y=bh+14+Math.floor(i/cols)*22;
    lg+='<g style="--fc:var(--'+f.color+')"><path class="ep" style="fill:none;stroke:var(--fc);stroke-width:3" d="M'+x+','+y+' h28"/><text class="lg" x="'+(x+36)+'" y="'+(y+4)+'">'+esc(f.name)+'</text></g>';
  });
  tmp.innerHTML='<g transform="translate('+(-b.x0)+','+(-b.y0)+')">'+content({clean:true})+'</g>'+lg;
  document.body.appendChild(tmp);
  var props=['fill','stroke','stroke-width','stroke-dasharray','opacity','font-family','font-size','font-weight','letter-spacing','text-anchor'];
  Array.prototype.forEach.call(tmp.querySelectorAll('*'),function(el){
    var cs=getComputedStyle(el);props.forEach(function(p){var v=cs.getPropertyValue(p);if(v)el.style.setProperty(p,v);});
  });
  var bg=document.createElementNS(NS,'rect');
  bg.setAttribute('width',Wx);bg.setAttribute('height',Hx);bg.setAttribute('fill',getComputedStyle(document.body).backgroundColor);
  tmp.insertBefore(bg,tmp.firstChild);tmp.removeAttribute('style');
  var s=new XMLSerializer().serializeToString(tmp);tmp.remove();
  return {s:s,w:Wx,h:Hx};
}
$('#exSvg').addEventListener('click',function(){saveFile('flujos-estacion.svg',exportSvgString().s);});
$('#exPng').addEventListener('click',function(){
  try{
    var r=exportSvgString(),url=URL.createObjectURL(new Blob([r.s],{type:'image/svg+xml;charset=utf-8'})),img=new Image();
    img.onload=function(){
      var sc=Math.min(2,4096/Math.max(r.w,r.h)),c=document.createElement('canvas');c.width=Math.round(r.w*sc);c.height=Math.round(r.h*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){if(b)saveFile('flujos-estacion.png',b);else toast('No se pudo generar el PNG. Prueba con SVG.');},'image/png');
    };
    img.onerror=function(){URL.revokeObjectURL(url);toast('No se pudo generar el PNG. Prueba con SVG.');};
    img.src=url;
  }catch(err){toast('No se pudo generar el PNG. Prueba con SVG.');}
});
$('#exCsv').addEventListener('click',function(){
  var rows=[['Origen','Código origen','Destino','Código destino','Tipo de recorrido']];
  S.edges.forEach(function(e){var a=nodeById(e.from),b=nodeById(e.to),f=flowById(e.flow);rows.push([a?a.name:'',a?a.code:'',b?b.name:'',b?b.code:'',f?f.name:'']);});
  saveFile('conexiones-estacion.csv','﻿'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n'));
});
$('#exJson').addEventListener('click',function(){saveFile('diagrama-flujos-estacion.json',JSON.stringify(S,null,1));});
$('#impFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=sanitize(JSON.parse(r.result));if(!d)throw new Error('x');
      undoSt.push(lastSnap);redoSt=[];stopAll(true);S=d;lastSnap=JSON.stringify(S);sel={t:null,id:null};pick=null;fullRefresh();fitView();render();persist();updateUndo();toast('Diagrama cargado.');
    }catch(err){toast('El archivo no es un diagrama válido.');}
    e.target.value='';
  };
  r.readAsText(f);
});
$('#resetAll').addEventListener('click',function(){
  undoSt.push(lastSnap);redoSt=[];stopAll(true);S=defaults();lastSnap=JSON.stringify(S);sel={t:null,id:null};pick=null;
  fullRefresh();fitView();render();persist();updateUndo();toast('Se restableció el diagrama inicial. Puedes usar Deshacer.');
});

/* ---------- Inicio ---------- */
measure();fitView();fullRefresh();updateUndo();
if(window.ResizeObserver){
  var rt=null;new ResizeObserver(function(){clearTimeout(rt);rt=setTimeout(function(){var ow=CW,oh=CH;measure();if(Math.abs(ow-CW)>1||Math.abs(oh-CH)>1){fitView();render();}},120);}).observe(stage);
}
})();
</script>
